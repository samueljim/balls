[package]
name = "game-core"
version = "0.1.0"
edition = "2021"
description = "Balls-like game engine using macroquad"

[[bin]]
name = "game-core"
path = "src/main.rs"

[dependencies]
macroquad = "0.4"
egui-macroquad = { version = "0.17.3", default-features = false }

[profile.release]
opt-level = "s"
